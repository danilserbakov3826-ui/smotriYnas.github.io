<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="CSS/style.css"> 
    <link rel="stylesheet" href="CSS/registration.css">
    <link rel="stylesheet" href="CSS/reset.css">
    <link rel="stylesheet" href="CSS/media.css">

</head>
<body>
    <div class="registration">
    <a class="registration-logo" href="Index.html"><img class="registration-logo-img" src="Icons/logoRegistration.png" alt=""></a>
    <div class="registration__form">
        <div class="registration__menu">
            <a href="Index.html"><img src="Icons/back.png" alt="">
            </a>
            <h2 class="registration__menu-title">Регистрация</h2>
            <a class="registration__menu-entrance" href="#">Войти
            </a>
        </div>
        <div class="registration__text">
            <p class="registration__text-name">Введите имя</p>
            <input id="input__name" class="registration__text-input" type="text">
            <p class="registration__text-name">Введите почту</p>
            <input id="input__email" class="registration__text-input" type="email">
            <p class="registration__text-name">Введите пароль</p>
            <input id="input__password" class="registration__text-input" type="password">
           
        </div>
         <a href="#" class="registration-btn">Зарегистрироваться</a>
         <a href="#" class="registration-pol">Политика конфидециальности</a>
    </div>
    </div>

    <script src="JS/registretion.js"></script>
</body>
</html>
